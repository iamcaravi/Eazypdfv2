[build]
  command = "npm ci && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# `netlify dev` (see package.json's "dev:netlify" script) serves the raw
# root files directly - the exact same source dev-server.py already
# serves for the plain static workflow - rather than running the
# production build/[build].command first. Without this, Netlify CLI has
# no static framework to detect, falls back to running [build].command
# once, and exits the moment it finishes instead of staying up as a dev
# server. This block only affects `netlify dev`; deploys still use
# [build] above untouched.
[dev]
  publish = "."
  framework = "#static"
  autoLaunch = false